# BACKGROUND (Takes current desktop screen and blurs it)
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL SETTINGS
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# LOCK ICON (Top center)
label {
    monitor =
    text = 󰌾
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 320
    halign = center
    valign = center
}

# TIME (Large Clock)
label {
    monitor =
    text = $TIME
    color = rgba(242, 243, 244, 0.95)
    font_size = 95
    font_family = Inter Bold
    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(242, 243, 244, 0.8)
    font_size = 22
    font_family = Inter
    position = 0, 110
    halign = center
    valign = center
}

# GREETING TEXT ("Hi, username")
label {
    monitor =
    text = $USER
    color = rgba(242, 243, 244, 0.75)
    font_size = 18
    font_family = Inter Italic
    position = 0, -10
    halign = center
    valign = center
}

# INPUT FIELD (Pill Shape / Glassmorphism)
input-field {
    monitor =
    size = 220, 48
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(242, 243, 244)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">Enter Pass</span>
    hide_input = false
    rounding = 24
    position = 0, -70
    halign = center
    valign = center
}
