palette = "noctalia"


# --- POWERLEVEL10K LAYOUT ---
format = """
[░▒▓](#49473d)\
[ 󰣇 ](bg:#49473d fg:#e6e2de)\
[](bg:#cbc6b8 fg:#49473d)\
$directory\
[](fg:#cbc6b8 bg:#edfce6)\
$git_branch\
$git_status\
[](fg:#edfce6 bg:#cdc7a9)\
$c$elixir$elm$golang$gradle$haskell$haxe$java$julia$kotlin$lua$nim$nodejs$python$ruby$rust$scala\
[](fg:#cdc7a9 bg:#949185)\
$docker_context\
[](fg:#949185)\
\n$character"""

# Directory module (uses Noctalia's yellow/cyan variable)
[directory]
style = "bg:#cbc6b8 fg:#49473d"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

# Git Branch module (uses Noctalia's blue variable)
[git_branch]
symbol = ""
style = "bg:#edfce6 fg:#49473d"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#edfce6 fg:#49473d"
format = '[$all_status$ahead_behind ]($style)'

# Language modules block
[python]
symbol = " "
style = "bg:#cdc7a9 fg:#49473d"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = " "
style = "bg:#cdc7a9 fg:#49473d"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#cdc7a9 fg:#49473d"
format = '[ $symbol ($version) ]($style)'

# Character prompt symbol
[character]
success_symbol = "[❯](bold #fff7d8)"
error_symbol = "[❯](bold #ffb4ab)"

