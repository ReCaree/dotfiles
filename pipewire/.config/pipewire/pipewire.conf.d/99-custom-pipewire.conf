context.properties = {
    ## Core Clock Setup
    # 48kHz is standard for Linux OS, games, and video content
    default.clock.rate = 48000

    # Avoid unnecessary resampling when playing 44.1kHz CDs or High-Res FLACs
    default.clock.allowed-rates = [ 44100, 48000, 88200, 96000, 192000 ]

    ## Quantum / Buffer Settings (~10.7ms Latency at 48kHz)
    # Increase to 1024 if your hardware still experiences audio dropouts
    default.clock.quantum = 512
    default.clock.min-quantum = 512 
    default.clock.max-quantum = 2048

    ## Resampling Quality
    # Range 0-14 (Default: 4). Setting to 10 provides high audio quality with negligible CPU usage.
    resample.quality = 10
}

stream.properties = {
    # Keeps streams responsive without dropping buffers
    node.latency = 512/48000
    resample.quality = 10
}

# Fix crackling/popping for legacy PulseAudio clients
pulse.properties = {
    pulse.min.req = 512/48000
    pulse.min.quantum = 256/48000
}
